name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild -workspace HXPhotoPickerExample.xcworkspace \\
            -scheme HXPhotoPickerExample \\
            -configuration Release -sdk iphoneos \\
            -derivedDataPath build \\
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \\
            | tail -50

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HXPhotoPicker-unsigned.ipa Payload
          ls -la HXPhotoPicker-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hxphotopicker-ipa
          path: HXPhotoPicker-unsigned.ipa
          retention-days: 7
''