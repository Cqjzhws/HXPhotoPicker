name: Build Ad-hoc IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          pod --version || true

      - name: Build and package IPA
        run: bash scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hxphotopicker-adhoc-ipa
          path: |
            HXPhotoPicker-adhoc.ipa
            HXPhotoPicker-adhoc.ipa.sha256
          retention-days: 7
